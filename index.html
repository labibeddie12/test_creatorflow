    function rentBaseTotal(){const f=document.getElementById("cf-rent-form"),start=f.elements.startDate.value,end=f.elements.endDate.value,qty=Number(f.elements.quantity.value||1);if(!start||!end||new Date(end)<new Date(start))return null;return{days:rentDays(start,end),qty,base:rMoney(selectedRentalItem.pricePerDay)*qty*rentDays(start,end)}}
    function updateRentTotal(){const totalEl=document.getElementById("cf-rent-total");if(!selectedRentalItem||!totalEl)return;const calc=rentBaseTotal();if(!calc){totalEl.textContent="Total: —";return}const{days,qty,base}=calc;if(appliedRentCoupon){const discount=appliedRentCoupon.type==="percent"?base*(appliedRentCoupon.value/100):Math.min(appliedRentCoupon.value,base),final=Math.max(0,base-discount);totalEl.innerHTML=`${days} day${days>1?"s":""} × ${qty} unit${qty>1?"s":""} = <s style="opacity:.6">₹${base.toLocaleString("en-IN")}</s> ₹${final.toLocaleString("en-IN")} <span style="color:var(--coral)">(${appliedRentCoupon.code} applied)</span>`}else{totalEl.textContent=`${days} day${days>1?"s":""} × ${qty} unit${qty>1?"s":""} = ₹${base.toLocaleString("en-IN")}`}}
    async function applyRentCoupon(){const f=document.getElementById("cf-rent-form"),code=f.elements.couponCode.value.trim(),statusEl=document.getElementById("cf-rent-coupon-status");appliedRentCoupon=null;if(!code){statusEl.textContent="";updateRentTotal();return}const calc=rentBaseTotal();if(!calc){statusEl.textContent="Pick your dates first, then we'll apply the coupon.";return}statusEl.textContent="Checking coupon...";const result=await window.cfValidateCoupon(code,calc.base);if(!result.valid){statusEl.textContent=result.error||"Invalid coupon";statusEl.style.color="#c2493f"}else{appliedRentCoupon=result;statusEl.textContent=`"${result.code}" applied — you saved ₹${result.discount.toLocaleString("en-IN")}`;statusEl.style.color="var(--coral)"}updateRentTotal()}
    function openRentModal(){ensureRentModal();const f=document.getElementById("cf-rent-form");f.reset();appliedRentCoupon=null;document.getElementById("cf-rent-coupon-status").textContent="";const verb=selectedRentalItem.type==="hire"?"Hire":"Rent";document.getElementById("cf-rent-title").textContent=selectedRentalItem.name;document.getElementById("cf-rent-status").textContent="";document.getElementById("cf-rent-total").textContent="Total: —";const submitBtn=document.querySelector("#cf-rent-form button[type=submit]");if(submitBtn)submitBtn.textContent=`${verb} request →`;document.getElementById("cf-rent-modal").hidden=false}
    document.addEventListener("click",e=>{const btn=e.target.closest("[data-rent-item]");if(!btn||btn.disabled)return;selectedRentalItem=rentalItemsList.find(x=>x.id===btn.dataset.rentItem);if(selectedRentalItem)openRentModal()});
    async function submitRental(e){e.preventDefault();const f=e.currentTarget,d=new FormData(f),start=String(d.get("startDate")||""),end=String(d.get("endDate")||""),statusEl=document.getElementById("cf-rent-status");if(new Date(end)<new Date(start)){statusEl.textContent="End date must be after start date.";return}const days=rentDays(start,end),qty=Number(d.get("quantity")||1),base=rMoney(selectedRentalItem.pricePerDay)*qty*days,discount=appliedRentCoupon?(appliedRentCoupon.type==="percent"?base*(appliedRentCoupon.value/100):Math.min(appliedRentCoupon.value,base)):0,total=Math.max(0,base-discount),button=f.querySelector("button[type=submit]"),verb=selectedRentalItem.type==="hire"?"Hire":"Rent";button.disabled=true;button.textContent="Sending request...";try{await addDoc(collection(rentalDb,"rentalBookings"),{itemId:selectedRentalItem.id,itemName:selectedRentalItem.name,itemType:selectedRentalItem.type||"rent",pricePerDay:selectedRentalItem.pricePerDay,quantity:qty,startDate:new Date(start),endDate:new Date(end),days,location:String(d.get("location")||""),name:String(d.get("name")||""),phone:String(d.get("phone")||""),email:String(d.get("email")||""),subtotal:`₹${base.toLocaleString("en-IN")}`,couponCode:appliedRentCoupon?appliedRentCoupon.code:null,discountAmount:discount?`₹${discount.toLocaleString("en-IN")}`:null,totalPrice:`₹${total.toLocaleString("en-IN")}`,status:"requested",createdAt:serverTimestamp()});if(appliedRentCoupon)window.cfIncrementCouponUsage(appliedRentCoupon.code);statusEl.textContent="Request sent! We'll confirm availability shortly.";f.reset();setTimeout(()=>{document.getElementById("cf-rent-modal").hidden=true},1600)}catch(err){statusEl.textContent="Failed: "+err.message}finally{button.disabled=false;button.textContent=`${verb} request →`}}
  </script>
